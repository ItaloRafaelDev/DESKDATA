name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes e build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Os testes simulam o Electron; o binário não é necessário para typecheck, testes e build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Auditoria de dependências informativa; revisar na Fase 2.
      - name: Auditoria de dependências de produção (informativo)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
